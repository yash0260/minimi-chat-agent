<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minimi chat</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f4f4f5;
      --text: #18181b;
      --text-muted: #71717a;
      --border: #e4e4e7;
      --accent: #2563eb;
      --accent-light: #dbeafe;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --assistant-bg: #f4f4f5;
      --assistant-text: #18181b;
      --status-bg: #fef3c7;
      --status-text: #92400e;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #09090b;
        --bg-secondary: #18181b;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --border: #27272a;
        --accent: #3b82f6;
        --accent-light: #1e3a5f;
        --user-bg: #2563eb;
        --user-text: #ffffff;
        --assistant-bg: #18181b;
        --assistant-text: #fafafa;
        --status-bg: #422006;
        --status-text: #fbbf24;
      }
    }

    :root[data-theme="dark"] {
      --bg: #09090b;
      --bg-secondary: #18181b;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --accent: #3b82f6;
      --accent-light: #1e3a5f;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --assistant-bg: #18181b;
      --assistant-text: #fafafa;
      --status-bg: #422006;
      --status-text: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-actions { display: flex; gap: 8px; }

    button {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--bg-secondary); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 720px;
      width: fit-content;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: var(--user-bg);
      color: var(--user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: var(--assistant-bg);
      color: var(--assistant-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.status {
      background: var(--status-bg);
      color: var(--status-text);
      align-self: flex-start;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .message.error {
      background: #fecaca;
      color: #991b1b;
      align-self: center;
      font-size: 13px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .message.error {
        background: #450a0a;
        color: #fca5a5;
      }
    }

    .message .timestamp {
      display: block;
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .welcome {
      text-align: center;
      color: var(--text-muted);
      margin: auto;
      padding: 20px;
      max-width: 400px;
    }

    .welcome h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .welcome p { font-size: 14px; line-height: 1.6; }

    #input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #input-area form {
      display: flex;
      gap: 8px;
      max-width: 720px;
      margin: 0 auto;
    }

    #input-area textarea {
      flex: 1;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 42px;
      max-height: 160px;
    }

    #input-area textarea:focus { border-color: var(--accent); }

    #input-area button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-weight: 500;
    }

    #input-area button[type="submit"]:hover { opacity: 0.9; }
    #input-area button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .thinking-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* Sidebar for sessions */
    .sidebar {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 280px;
      height: 100%;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      z-index: 100;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
      overflow-y: auto;
    }

    .sidebar.open { display: flex; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .sidebar-header h3 { font-size: 14px; font-weight: 600; }

    .session-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
      transition: background 0.1s;
    }

    .session-item:hover { background: var(--border); }
    .session-item.active { background: var(--accent-light); }

    .session-item .session-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-item .session-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 50;
    }

    .overlay.open { display: block; }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Conversations</h3>
      <button id="close-sidebar">✕</button>
    </div>
    <div id="session-list"></div>
  </div>

  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="open-sidebar" title="Conversations">☰</button>
      <h1>minimi chat</h1>
    </div>
    <div class="header-actions">
      <button id="new-session">New chat</button>
    </div>
  </header>

  <div id="messages">
    <div class="welcome">
      <h2>minimi chat agent</h2>
      <p>Ask me anything. I remember our past conversations and can check whether my previous answers are still correct.</p>
    </div>
  </div>

  <div id="input-area">
    <form id="chat-form">
      <textarea id="input" rows="1" placeholder="Send a message…" autofocus></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const sessionList = document.getElementById('session-list');

    let sessionId = localStorage.getItem('sessionId');
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem('sessionId', sessionId);
    }

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    // Submit on Enter (Shift+Enter for newline)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function clearWelcome() {
      const w = messagesEl.querySelector('.welcome');
      if (w) w.remove();
    }

    function addMessage(role, text) {
      clearWelcome();
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addStatus(text) {
      clearWelcome();
      const div = document.createElement('div');
      div.className = 'message status';
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function removeStatuses() {
      messagesEl.querySelectorAll('.message.status').forEach(el => el.remove());
    }

    // Load session history
    async function loadSession(id) {
      sessionId = id;
      localStorage.setItem('sessionId', id);
      messagesEl.innerHTML = '';

      try {
        const res = await fetch(`/api/sessions/${id}`);
        const messages = await res.json();
        if (messages.length === 0) {
          messagesEl.innerHTML = `
            <div class="welcome">
              <h2>minimi chat agent</h2>
              <p>Ask me anything. I remember our past conversations and can check whether my previous answers are still correct.</p>
            </div>`;
          return;
        }
        for (const m of messages) {
          addMessage(m.role, m.content);
        }
      } catch {
        messagesEl.innerHTML = `
          <div class="welcome">
            <h2>minimi chat agent</h2>
            <p>Ask me anything. I remember our past conversations and can check whether my previous answers are still correct.</p>
          </div>`;
      }
    }

    // New session
    document.getElementById('new-session').addEventListener('click', () => {
      sessionId = crypto.randomUUID();
      localStorage.setItem('sessionId', sessionId);
      messagesEl.innerHTML = `
        <div class="welcome">
          <h2>minimi chat agent</h2>
          <p>Ask me anything. I remember our past conversations and can check whether my previous answers are still correct.</p>
        </div>`;
      input.focus();
    });

    // Sidebar
    document.getElementById('open-sidebar').addEventListener('click', async () => {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      try {
        const res = await fetch('/api/sessions');
        const sessions = await res.json();
        sessionList.innerHTML = sessions.length === 0
          ? '<p style="font-size:13px;color:var(--text-muted);padding:8px">No conversations yet.</p>'
          : sessions.map(s => `
            <div class="session-item ${s.session_id === sessionId ? 'active' : ''}" data-id="${s.session_id}">
              <div class="session-preview">${escapeHtml(s.last_message || '(empty)')}</div>
              <div class="session-date">${new Date(s.started_at + 'Z').toLocaleDateString()} · ${s.message_count} msgs</div>
            </div>
          `).join('');

        sessionList.querySelectorAll('.session-item').forEach(el => {
          el.addEventListener('click', () => {
            loadSession(el.dataset.id);
            closeSidebar();
          });
        });
      } catch {
        sessionList.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:8px">Could not load sessions.</p>';
      }
    });

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }

    document.getElementById('close-sidebar').addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Send message
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage('user', text);
      const thinkingEl = addStatus('Thinking…');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));

            if (data.type === 'status') {
              thinkingEl.textContent = data.content;
            } else if (data.type === 'text') {
              removeStatuses();
              thinkingEl.remove();
              addMessage('assistant', data.content);
            } else if (data.type === 'error') {
              removeStatuses();
              thinkingEl.remove();
              addMessage('error', data.content);
            }
          }
        }
      } catch (err) {
        removeStatuses();
        thinkingEl.remove();
        addMessage('error', 'Connection error. Is the server running?');
      }

      sendBtn.disabled = false;
      input.focus();
    });

    // Load current session on start
    loadSession(sessionId);
  </script>
</body>
</html>
